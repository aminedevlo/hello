<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEO Metadata Inspector</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --primary: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 16px;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    /* Input Controls */
    .search-box {
      display: flex;
      gap: 8px;
    }

    input[type="url"] {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="url"]:focus {
      border-color: var(--primary);
    }

    button {
      background: var(--primary);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Preview Card */
    .preview-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: none;
    }

    .preview-image {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background: #0b1120;
      display: block;
    }

    .card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .site-domain {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .site-title {
      font-size: 1.2rem;
      font-weight: 600;
      line-height: 1.4;
    }

    .site-desc {
      font-size: 0.92rem;
      color: var(--muted);
      line-height: 1.5;
    }

    /* Meta Table */
    .meta-details {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: 120px 1fr;
      row-gap: 8px;
      font-size: 0.85rem;
    }

    .meta-label {
      color: var(--muted);
      font-weight: 500;
    }

    .meta-value {
      word-break: break-all;
      color: var(--text);
    }

    /* Status Notifications */
    .status {
      font-size: 0.9rem;
      color: var(--muted);
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>SEO Metadata Inspector</h1>
    <p>Fetch OpenGraph, Twitter Cards, and standard HTML meta elements.</p>
  </header>

  <div class="search-box">
    <input type="url" id="targetUrl" placeholder="https://example.com" required>
    <button id="fetchBtn" onclick="inspectUrl()">Inspect</button>
  </div>

  <div id="statusMessage" class="status"></div>

  <div class="preview-card" id="card">
    <img id="cardImage" class="preview-image" alt="Thumbnail Preview" style="display: none;">
    <div class="card-body">
      <span class="site-domain" id="cardDomain"></span>
      <h2 class="site-title" id="cardTitle"></h2>
      <p class="site-desc" id="cardDesc"></p>
    </div>
    <div class="meta-details" id="metaTable"></div>
  </div>
</div>

<script>
  async function inspectUrl() {
    const input = document.getElementById("targetUrl");
    const button = document.getElementById("fetchBtn");
    const status = document.getElementById("statusMessage");
    const card = document.getElementById("card");

    const target = input.value.trim();
    if (!target) return;

    // Reset UI
    button.disabled = true;
    status.style.display = "block";
    status.textContent = "Fetching page markup...";
    card.style.display = "none";

    try {
      // Use AllOrigins to bypass client-side CORS constraints
      const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(target)}`;
      const response = await fetch(proxyUrl);
      
      if (!response.ok) throw new Error("Failed to reach proxy.");
      
      const payload = await response.json();
      const htmlText = payload.contents;

      if (!htmlText) throw new Error("No HTML contents returned.");

      // Parse raw HTML using browser's native DOMParser
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, "text/html");

      // Extraction Helper
      const getMeta = (queries) => {
        for (const q of queries) {
          const el = doc.querySelector(q);
          if (el) {
            const val = el.getAttribute("content") || el.innerText;
            if (val && val.trim()) return val.trim();
          }
        }
        return null;
      };

      // Query OpenGraph, Twitter, and standard fallbacks
      const title = getMeta([
        'meta[property="og:title"]',
        'meta[name="twitter:title"]',
        'title'
      ]) || "No title detected";

      const description = getMeta([
        'meta[property="og:description"]',
        'meta[name="twitter:description"]',
        'meta[name="description"]'
      ]) || "No description detected";

      const image = getMeta([
        'meta[property="og:image"]',
        'meta[name="twitter:image"]',
        'link[rel="image_src"]'
      ]);

      const canonical = getMeta([
        'link[rel="canonical"]',
        'meta[property="og:url"]'
      ]) || target;

      // Format relative image URLs into absolute URLs
      let finalImageUrl = null;
      if (image) {
        try {
          finalImageUrl = new URL(image, target).href;
        } catch {
          finalImageUrl = image;
        }
      }

      // Populate UI Preview
      const parsedUrl = new URL(target);
      document.getElementById("cardDomain").textContent = parsedUrl.hostname;
      document.getElementById("cardTitle").textContent = title;
      document.getElementById("cardDesc").textContent = description;

      const imgElement = document.getElementById("cardImage");
      if (finalImageUrl) {
        imgElement.src = finalImageUrl;
        imgElement.style.display = "block";
      } else {
        imgElement.style.display = "none";
      }

      // Populate Data Table
      const metaTable = document.getElementById("metaTable");
      metaTable.innerHTML = `
        <div class="meta-label">Title</div>
        <div class="meta-value">${escapeHtml(title)}</div>
        <div class="meta-label">Description</div>
        <div class="meta-value">${escapeHtml(description)}</div>
        <div class="meta-label">Canonical</div>
        <div class="meta-value">${escapeHtml(canonical)}</div>
        <div class="meta-label">Image URL</div>
        <div class="meta-value">${finalImageUrl ? escapeHtml(finalImageUrl) : "None"}</div>
      `;

      status.style.display = "none";
      card.style.display = "block";

    } catch (err) {
      status.style.display = "block";
      status.textContent = `Error: ${err.message}`;
    } finally {
      button.disabled = false;
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }
</script>

</body>
</html>
